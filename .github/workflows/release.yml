name: Release Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Public Directory
        run: |
          mkdir public
          cp app/build/outputs/apk/debug/app-debug.apk public/SecureSMSForwarder.apk
          VERSION_NAME=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "{\"latestVersionName\":\"$VERSION_NAME\",\"downloadUrl\":\"https://smsforwarder-7eb77.web.app/SecureSMSForwarder.apk\"}" > public/version.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMSFORWARDER_7EB77 }}
          channelId: live
          projectId: smsforwarder-7eb77
